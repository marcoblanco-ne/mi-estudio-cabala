es:`<div class="eyebrow">Lección completa</div><h2>Qué es realmente la Cábala y qué representa el Árbol de la Vida</h2><p>Comenzamos con la <b>Cábala judía histórica</b>. Más adelante compararemos la Cabala cristiana y la Qabalah hermética. Separarlas evita atribuir a la tradición judía ideas procedentes de desarrollos posteriores.</p><h3>1. Una “tradición recibida”</h3><p><b>קַבָּלָה — Kabbalah</b> procede de una raíz hebrea asociada con “recibir”. Es una tradición que explora la relación entre Dios, la creación y el ser humano: cómo lo infinito se relaciona con lo finito y cómo la multiplicidad puede surgir sin destruir la Unidad.</p><div class="callout"><b>Regla inicial:</b> no todo misticismo judío es Cábala, aunque la Cábala forme parte del misticismo judío.</div><h3>2. Tres tradiciones distintas</h3><p><b>Kabbalah o Cábala judía:</b> Torá, Ein Sof, sefirot y Zohar.<br><b>Cabala cristiana:</b> reinterpretación renacentista cristiana.<br><b>Qabalah hermética:</b> integración occidental con tarot, astrología, alquimia y magia ceremonial.</p><h3>3. Tres textos en el mapa</h3><p><b>Sefer Yetzirah</b>, texto antiguo y breve, presenta diez sefirot y veintidós letras, aunque sus sefirot no equivalen exactamente al sistema posterior. <b>Sefer ha-Bahir</b>, difundido en la Europa medieval, desarrolla el simbolismo dinámico de las sefirot. El <b>Zohar</b>, aparecido históricamente en la España del siglo XIII y atribuido por la tradición a Rabí Shimon bar Yochai, es central para la Cábala clásica.</p><h3>4. Ein Sof</h3><p><b>אין סוף — Ein Sof</b> significa “Sin Fin”. Habla de la Divinidad como infinita e incognoscible; no es el nombre de otro dios.</p><div class="callout">Si lo infinito es verdaderamente infinito, ¿cómo puede relacionarse con algo finito?</div><h3>5. Las sefirot</h3><p>Las <b>sefirot</b> pueden entenderse, según el contexto, como emanaciones, atributos, modalidades, potencias o canales de expresión divina. No son diez dioses independientes.</p><div class="flow"><b>Ein Sof</b><span>→</span><b>Diez sefirot</b><span>→</span><b>Creación</b></div><p>Como analogía inicial, imagina luz blanca atravesando un prisma: la luz sigue siendo una, aunque podamos percibir diferentes colores.</p><h3>6. Las diez sefirot</h3><p>Keter, Chokhmah, Binah, Chesed, Gevurah, Tiferet, Netzach, Hod, Yesod y Malkhut.</p><h3>7. El Árbol de la Vida</h3><p>El Árbol es una <b>representación simbólica de relaciones</b>. El dibujo no es la Cábala, del mismo modo que un plano no es la instalación que representa.</p><h3>8. Da’at</h3><p><b>דעת — Da’at</b> significa conocimiento. Aparece en ciertos diagramas, pero no debe añadirse ingenuamente como una undécima sefirá: la tradición insiste en diez.</p><h3>9. Qué no mezclar todavía</h3><p>Tarot, astrología, magia, chakras, planetas y correspondencias ocultistas se estudiarán solo después de adquirir una base que permita distinguir su origen histórico.</p><div class="callout"><b>Modelo mental:</b> Ein Sof = lo ilimitado; sefirot = diez modalidades de manifestación; Árbol de la Vida = mapa simbólico de sus relaciones.</div>`,
en:`<div class="eyebrow">Complete lesson</div><h2>What Kabbalah really is and what the Tree of Life represents</h2><p>We begin with <b>historical Jewish Kabbalah</b>. Later we will compare Christian Cabala and Hermetic Qabalah. Keeping them distinct prevents later developments from being projected backward onto Jewish tradition.</p><h3>1. A “received tradition”</h3><p><b>קַבָּלָה — Kabbalah</b> comes from a Hebrew root associated with “receiving.” It explores the relationship among God, creation, and the human being: how the infinite relates to the finite and how multiplicity can arise without destroying Unity.</p><div class="callout"><b>Initial rule:</b> not all Jewish mysticism is Kabbalah, although Kabbalah belongs to Jewish mysticism.</div><h3>2. Three distinct traditions</h3><p><b>Jewish Kabbalah:</b> Torah, Ein Sof, sefirot, and Zohar.<br><b>Christian Cabala:</b> Christian Renaissance reinterpretation.<br><b>Hermetic Qabalah:</b> Western synthesis involving tarot, astrology, alchemy, and ceremonial magic.</p><h3>3. Three texts on the map</h3><p><b>Sefer Yetzirah</b>, an ancient concise text, presents ten sefirot and twenty-two letters, although its sefirot are not identical to the later system. <b>Sefer ha-Bahir</b>, circulated in medieval Europe, develops dynamic sefirotic symbolism. The <b>Zohar</b>, historically appearing in thirteenth-century Spain and traditionally attributed to Rabbi Shimon bar Yochai, is central to classical Kabbalah.</p><h3>4. Ein Sof</h3><p><b>אין סוף — Ein Sof</b> means “Without End.” It speaks of the Divine as infinite and unknowable; it is not the name of another god.</p><div class="callout">If the infinite is truly infinite, how can it relate to something finite?</div><h3>5. The sefirot</h3><p>Depending on context, the <b>sefirot</b> may be understood as emanations, attributes, modalities, powers, or channels of divine expression. They are not ten independent gods.</p><div class="flow"><b>Ein Sof</b><span>→</span><b>Ten sefirot</b><span>→</span><b>Creation</b></div><p>As an initial analogy, imagine white light passing through a prism: the light remains one even though different colors become perceptible.</p><h3>6. The ten sefirot</h3><p>Keter, Chokhmah, Binah, Chesed, Gevurah, Tiferet, Netzach, Hod, Yesod, and Malkhut.</p><h3>7. The Tree of Life</h3><p>The Tree is a <b>symbolic representation of relationships</b>. The diagram is not Kabbalah itself, just as a blueprint is not the installation it represents.</p><h3>8. Da’at</h3><p><b>דעת — Da’at</b> means knowledge. It appears in some diagrams but should not simply be added as an eleventh sefirah: the tradition insists on ten.</p><h3>9. What not to mix in yet</h3><p>Tarot, astrology, magic, chakras, planets, and occult correspondences will be studied only after a foundation is strong enough to distinguish their historical origins.</p><div class="callout"><b>Mental model:</b> Ein Sof = the unlimited; sefirot = ten modalities of manifestation; Tree of Life = symbolic map of their relationships.</div>`
};

const lesson2={
es:`<div class="eyebrow">Lección completa · Fundamentos</div><h2>Ein Sof — Lo infinito que ninguna definición puede contener</h2><p><b>Objetivo:</b> comprender qué significa <i>Ein Sof</i>, qué podemos y qué no podemos afirmar mediante este concepto, y por qué será indispensable para comprender después la manifestación y las sefirot.</p><h3>1. Antes de aprender el término</h3><p>Compara: <b>“Dios es infinitamente poderoso”</b> y <b>“Dios es infinito.”</b> La primera frase habla de un atributo —el poder— sin límite. La segunda intenta hablar de lo divino mismo como no limitado.</p><div class="check-gate" data-gate="1"><h4>Puerta de comprensión 1</h4><p>¿Cuál se aproxima mejor a Ein Sof?</p><label><input type="radio" name="g1" value="0"> Dios posee una cantidad enorme de poder.</label><label><input type="radio" name="g1" value="1"> Dios es la entidad más grande del universo.</label><label><input type="radio" name="g1" value="2"> Señala la infinitud divina, no completamente delimitable por nuestras categorías.</label><label><input type="radio" name="g1" value="3"> Es la primera de las diez sefirot.</label><button class="btn gate-check" type="button" data-answer="2">Comprobar</button><div class="gate-feedback"></div></div><h3>2. אין סוף — Ein Sof</h3><p><b>אין סוף — Ein Sof</b> significa aproximadamente <b>“sin fin” / “sin límite”</b>. En el pensamiento cabalístico se usa para hablar de la divinidad precisamente en cuanto ilimitada. Aprender esta expresión no significa haber definido completamente a Dios; apunta al problema contrario: ninguna definición humana puede contener por completo aquello que se considera ilimitado.</p><div class="callout"><b>Clave:</b> infinito no significa simplemente “extremadamente grande”. Algo gigantesco todavía puede ser medido o delimitado.</div><h3>3. El problema de una mente limitada</h3><p>Nosotros tenemos límites: nuestra percepción, lenguaje y conocimiento son finitos. Por eso debemos distinguir entre <b>conocer algo</b> y <b>abarcarlo completamente</b>. No comprender exhaustivamente a Ein Sof no significa que no podamos conocer nada acerca de lo divino.</p><div class="check-gate" data-gate="2"><h4>Puerta de comprensión 2</h4><p>“Si Ein Sof no puede comprenderse completamente, entonces no podemos conocer nada acerca de Dios.” ¿Qué falla?</p><label><input type="radio" name="g2" value="0"> Nada; la afirmación es correcta.</label><label><input type="radio" name="g2" value="1"> Confunde no comprender algo completamente con no poder conocer nada acerca de ello.</label><label><input type="radio" name="g2" value="2"> Las diez sefirot permiten comprender completamente a Dios.</label><button class="btn gate-check" type="button" data-answer="1">Comprobar</button><div class="gate-feedback"></div></div><h3>4. El límite del lenguaje</h3><p>Incluso la palabra <i>infinito</i> pertenece a nuestro lenguaje finito. Esto no vuelve inútiles las palabras; exige reconocer sus límites.</p><div class="callout"><b>Regla del curso:</b> el símbolo puede señalar una realidad sin agotarla.</div><h3>5. Contexto histórico</h3><p>La idea de una divinidad trascendente es anterior a la Cábala medieval. Sin embargo, <b>Ein Sof adquiere una función técnica particularmente importante en el desarrollo de la Cábala medieval</b>, donde surge la tensión entre hablar de una divinidad ilimitada y, a la vez, hablar de atributos, manifestación, creación y multiplicidad sin dividir la unidad divina.</p><h3>6. Primera mirada hacia las sefirot</h3><p>Por ahora basta una precisión: las <b>sefirot no son diez pedazos que juntos forman a Dios</b>, ni diez dioses. Son parte del lenguaje simbólico y teológico con el que la Cábala articula diferenciaciones en la manifestación divina. Las estudiaremos después; no necesitamos adelantarlas aquí.</p><h3>7. Una analogía — y su peligro</h3><p>Imagina un vaso con agua del océano. El agua es real y puede estudiarse, pero tener ese vaso no equivale a contener todo el océano.</p><p><b>Lo que ayuda a comprender:</b> nuestro conocimiento puede ser real sin ser exhaustivo.</p><p><b>Donde falla:</b> Ein Sof no es literalmente un océano y Dios no está compuesto de pequeñas partes.</p><div class="check-gate" data-gate="3"><h4>Puerta de comprensión 3</h4><p>¿Qué debemos obtener de la analogía?</p><label><input type="radio" name="g3" value="0"> Dios está compuesto de partes como el océano de gotas.</label><label><input type="radio" name="g3" value="1"> Conocer parcialmente algo no equivale a abarcarlo completamente.</label><label><input type="radio" name="g3" value="2"> Ein Sof es una sustancia infinita.</label><button class="btn gate-check" type="button" data-answer="1">Comprobar</button><div class="gate-feedback"></div></div><h3>8. Lo que Ein Sof NO significa</h3><p><b>No</b> significa simplemente “Dios es muy grande”. <b>No</b> es una sefirah. <b>No</b> está físicamente arriba del Árbol. <b>No</b> convierte las sefirot en partes de Dios. Y estudiar las diez sefirot <b>no</b> significa haber comprendido completamente a Dios.</p><h3>9. El desafío de Ein Sof</h3><p>Si Ein Sof es ilimitado y nosotros experimentamos un universo lleno de límites, aparece la pregunta: <b>¿cómo puede lo limitado relacionarse con una fuente ilimitada?</b></p><p>No resolveremos todavía esa pregunta. Conceptos posteriores —incluido mucho más adelante el <b>Tzimtzum</b> luriano— pertenecen a otras etapas históricas. La próxima lección comenzará a estudiar el puente conceptual entre <b>Ein Sof → manifestación → creación</b>.</p><h3>10. Reflexión personal</h3><p>Esta reflexión no tiene una respuesta mística “correcta”.</p><textarea class="reflection-box" id="lessonReflection" placeholder="¿Qué cambia en mi manera de pensar cuando acepto que algo puede ser verdadero y, al mismo tiempo, superar mi capacidad de comprenderlo completamente?"></textarea><p class="small">Se guarda junto con tus notas de esta lección.</p><div class="callout"><b>Idea de cierre:</b> Ein Sof señala aquello de lo divino que ninguna frontera conceptual puede contener completamente.</div>`,
en:`<div class="eyebrow">Complete lesson · Foundations</div><h2>Ein Sof — The infinite no definition can contain</h2><p><b>Objective:</b> understand what <i>Ein Sof</i> means, what we can and cannot claim through this concept, and why it will later be essential for understanding manifestation and the sefirot.</p><h3>1. Before learning the term</h3><p>Compare: <b>“God is infinitely powerful”</b> and <b>“God is infinite.”</b> The first speaks about one attribute — power — without limit. The second attempts to speak of the Divine itself as unlimited.</p><div class="check-gate" data-gate="1"><h4>Understanding Gate 1</h4><p>Which statement best approaches Ein Sof?</p><label><input type="radio" name="g1" value="0"> God possesses an enormous amount of power.</label><label><input type="radio" name="g1" value="1"> God is the largest entity in the universe.</label><label><input type="radio" name="g1" value="2"> It points to divine infinitude, not fully delimitable by our categories.</label><label><input type="radio" name="g1" value="3"> It is the first of the ten sefirot.</label><button class="btn gate-check" type="button" data-answer="2">Check</button><div class="gate-feedback"></div></div><h3>2. אין סוף — Ein Sof</h3><p><b>אין סוף — Ein Sof</b> means approximately <b>“without end” / “without limit.”</b> In Kabbalistic thought it is used to speak of the Divine precisely as unlimited. Learning the expression does not mean that God has now been completely defined; it points to the opposite problem: no human definition can fully contain what is regarded as unlimited.</p><div class="callout"><b>Key:</b> infinite does not simply mean “extremely large.” Something gigantic can still be measured or delimited.</div><h3>3. The problem of a limited mind</h3><p>We have limits: our perception, language, and knowledge are finite. We must therefore distinguish <b>knowing something</b> from <b>comprehending it exhaustively</b>. Not fully comprehending Ein Sof does not mean that nothing can be known about the Divine.</p><div class="check-gate" data-gate="2"><h4>Understanding Gate 2</h4><p>“If Ein Sof cannot be completely understood, then we can know nothing about God.” What is wrong?</p><label><input type="radio" name="g2" value="0"> Nothing; the statement is correct.</label><label><input type="radio" name="g2" value="1"> It confuses not comprehending something completely with being unable to know anything about it.</label><label><input type="radio" name="g2" value="2"> The ten sefirot allow us to comprehend God completely.</label><button class="btn gate-check" type="button" data-answer="1">Check</button><div class="gate-feedback"></div></div><h3>4. The limit of language</h3><p>Even the word <i>infinite</i> belongs to our finite language. This does not make words useless; it requires us to recognize their limits.</p><div class="callout"><b>Course rule:</b> a symbol can point toward a reality without exhausting it.</div><h3>5. Historical context</h3><p>The idea of a transcendent Divine predates medieval Kabbalah. Yet <b>Ein Sof takes on a particularly important technical role in the development of medieval Kabbalah</b>, where a central tension is how to speak about an unlimited Divine while also speaking about attributes, manifestation, creation, and multiplicity without dividing divine unity.</p><h3>6. A first look toward the sefirot</h3><p>For now one precision is enough: the <b>sefirot are not ten pieces that together make God</b>, nor are they ten gods. They belong to the symbolic and theological language through which Kabbalah articulates differentiation in divine manifestation. We will study them later rather than prematurely here.</p><h3>7. An analogy — and its danger</h3><p>Imagine a glass filled with ocean water. The water is real and can be studied, but holding that glass is not the same as containing the entire ocean.</p><p><b>What it helps us understand:</b> our knowledge can be real without being exhaustive.</p><p><b>Where it fails:</b> Ein Sof is not literally an ocean, and God is not composed of small pieces.</p><div class="check-gate" data-gate="3"><h4>Understanding Gate 3</h4><p>What should we take from the analogy?</p><label><input type="radio" name="g3" value="0"> God is composed of parts as the ocean is of drops.</label><label><input type="radio" name="g3" value="1"> Knowing something partially is not the same as comprehending it completely.</label><label><input type="radio" name="g3" value="2"> Ein Sof is an infinite substance.</label><button class="btn gate-check" type="button" data-answer="1">Check</button><div class="gate-feedback"></div></div><h3>8. What Ein Sof does NOT mean</h3><p>It does <b>not</b> simply mean “God is very large.” It is <b>not</b> a sefirah. It is <b>not</b> physically above the Tree. The sefirot are <b>not</b> pieces of God. And studying all ten sefirot does <b>not</b> mean that God has been completely comprehended.</p><h3>9. The challenge of Ein Sof</h3><p>If Ein Sof is unlimited and we experience a universe filled with limits, the question arises: <b>how can the limited relate to an unlimited source?</b></p><p>We will not solve that question yet. Later concepts — including, much later, Lurianic <b>Tzimtzum</b> — belong to other historical stages. The next lesson begins examining the conceptual bridge between <b>Ein Sof → manifestation → creation</b>.</p><h3>10. Personal reflection</h3><p>This reflection has no single “mystically correct” answer.</p><textarea class="reflection-box" id="lessonReflection" placeholder="What changes in my thinking when I accept that something can be true and still exceed my ability to comprehend it completely?"></textarea><p class="small">Saved together with your notes for this lesson.</p><div class="callout"><b>Closing idea:</b> Ein Sof points to that dimension of the Divine which no conceptual boundary can fully contain.</div>`};

const BASE_KEY='kabbalah-study-v4';
const freshState=()=>({current:1,status:{},notes:{},theme:'light',quiz:{},lang:'es',tree:{}});
let activeStorageKey=`${BASE_KEY}-guest`;
let state=JSON.parse(localStorage.getItem(activeStorageKey)||'null')||freshState();
let current=state.current||1, user=null, noteTimers={}, syncing=false;

function switchLocalState(uid=null){
  activeStorageKey=uid?`${BASE_KEY}-user-${uid}`:`${BASE_KEY}-guest`;
  state=JSON.parse(localStorage.getItem(activeStorageKey)||'null')||freshState();
  current=state.current||1;
  applyTheme();
  applyLanguage();
}
function t(){return I[state.lang||'es']}
function lessons(){const arr=[];stageData[state.lang||'es'].forEach(([stage,names])=>names.forEach(name=>arr.push({n:arr.length+1,name,stage})));return arr}
function saveLocal(){state.current=current;localStorage.setItem(activeStorageKey,JSON.stringify(state));renderProgress()}
function escapeHtml(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

async function loadCloud(){
 if(!user)return;
 setSync(t().syncing);
 try{
  const [{data:p},{data:n},{data:tr},{data:pr}]=await Promise.all([
   sb.from('lesson_progress').select('*').eq('user_id',user.id),
   sb.from('user_notes').select('*').eq('user_id',user.id),
   sb.from('user_tree').select('*').eq('user_id',user.id),
   sb.from('profiles').select('*').eq('id',user.id).maybeSingle()
  ]);
  if(p) p.forEach(x=>state.status[x.lesson_number]=x.status);
  if(n) n.forEach(x=>{if(x.lesson_number)state.notes[x.lesson_number]=x.note_text});
  if(tr) tr.forEach(x=>state.tree[x.sefirah_key]={level:x.mastery_level,unlocked:x.unlocked,reflection:x.reflection||''});
  if(pr?.preferred_language && ['es','en'].includes(pr.preferred_language)) state.lang=pr.preferred_language;
  saveLocal(); applyLanguage(); renderAll(); setSync(t().synced);
 }catch(e){console.error(e);setSync(navigator.onLine?t().local:t().offlineState)}
}

async function cloudStatus(lesson,status){
 if(!user)return;
 setSync(t().syncing);
 const payload={user_id:user.id,lesson_number:lesson,status,percent_complete:status==='mastered'?100:status==='not_started'?0:25,started_at:status==='not_started'?null:new Date().toISOString(),completed_at:status==='mastered'?new Date().toISOString():null,updated_at:new Date().toISOString()};
 const {error}=await sb.from('lesson_progress').upsert(payload,{onConflict:'user_id,lesson_number'});
 if(error) console.error(error);
 const map={4:'keter',5:'chokhmah',6:'binah',7:'chesed',8:'gevurah',9:'tiferet',10:'netzach',11:'hod',12:'yesod',13:'malkhut'};
 if(map[lesson]){
   const unlocked=status!=='not_started';
   await sb.from('user_tree').update({mastery_level:status,unlocked,updated_at:new Date().toISOString()}).eq('user_id',user.id).eq('sefirah_key',map[lesson]);
   state.tree[map[lesson]]={...(state.tree[map[lesson]]||{}),level:status,unlocked};
 }
 setSync(error?t().local:t().synced); renderTree();
}

async function cloudNote(lesson,text){
 if(!user)return;
 clearTimeout(noteTimers[lesson]);
 noteTimers[lesson]=setTimeout(async()=>{
  setSync(t().syncing);
  const {data:existing}=await sb.from('user_notes').select('id').eq('user_id',user.id).eq('lesson_number',lesson).limit(1);
  let error;
  if(existing?.length) ({error}=await sb.from('user_notes').update({note_text:text,updated_at:new Date().toISOString()}).eq('id',existing[0].id));
  else if(text.trim()) ({error}=await sb.from('user_notes').insert({user_id:user.id,lesson_number:lesson,note_text:text}));
  setSync(error?t().local:t().synced);
 },700);
}

async function saveQuiz(lesson,scoreVal,answers,total){
 if(!user)return;
 await sb.from('assessments').insert({user_id:user.id,lesson_number:lesson,score:scoreVal/total*100,passed:scoreVal>=Math.ceil(total*.8),answers});
}

async function saveLang(){
 if(user) await sb.from('profiles').update({preferred_language:state.lang,updated_at:new Date().toISOString()}).eq('id',user.id);
}

function setSync(s){syncState.textContent=s}
function renderNav(filter=''){let html='';const ls=lessons();stageData[state.lang].forEach(([stage])=>{const subset=ls.filter(l=>l.stage===stage&&(`${l.n} ${l.name}`.toLowerCase().includes(filter.toLowerCase())));if(!subset.length)return;html+=`<div class="stage">${stage}</div>`+subset.map(l=>`<button class="lesson-link ${l.n===current?'active':''}" data-lesson="${l.n}"><span class="num">${l.n}</span><span>${l.name}</span><i class="dot ${state.status[l.n]||''}"></i></button>`).join('')});lessonNav.innerHTML=html;document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>openLesson(+b.dataset.lesson))}
function tabs(inner){const x=t().tabs;return `<div class="tabs"><button class="tab active" data-tab="lesson">${x[0]}</button><button class="tab" data-tab="notes">${x[1]}</button><button class="tab" data-tab="cards">${x[2]}</button><button class="tab" data-tab="quiz">${x[3]}</button></div>${inner}`}
function renderContent(){const l=lessons()[current-1], tt=t();stageLabel.textContent=l.stage;heroTitle.textContent=`${state.lang==='es'?'Lección':'Lesson'} ${l.n} — ${l.name}`;heroDesc.textContent=current===1?tt.hero1:current===2?(state.lang==='es'?'Comprender lo divino como ilimitado, los límites de nuestro lenguaje y la diferencia entre conocer y abarcar completamente.':'Understanding the Divine as unlimited, the limits of our language, and the difference between knowing and comprehending exhaustively.'):tt.future;statusSelect.value=state.status[current]||'not_started';
 if(current>2){content.innerHTML=tabs(`<section class="pane active" data-pane="lesson"><div class="empty"><div class="sigil" style="margin:auto">${current}</div><h2>${l.name}</h2><p>${tt.future}</p></div></section><section class="pane" data-pane="notes"><h2>${tt.notesTitle}</h2><p class="small">${tt.notesAuto}</p><textarea class="notes" id="notes" placeholder="${tt.notesPlaceholder}">${escapeHtml(state.notes[current]||'')}</textarea></section><section class="pane" data-pane="cards"><div class="empty"><h2>${tt.cardsFuture}</h2></div></section><section class="pane" data-pane="quiz"><div class="empty"><h2>${tt.quizFuture}</h2></div></section>`)}
 else {const is2=current===2,qs=is2?questions2[state.lang]:questions[state.lang],cs=is2?cards2[state.lang]:cards[state.lang],body=is2?lesson2[state.lang]:lesson1[state.lang];content.innerHTML=tabs(`<section class="pane active" data-pane="lesson">${body}</section><section class="pane" data-pane="notes"><h2>${tt.notesTitle}</h2><p class="small">${tt.notesAuto}</p><textarea class="notes" id="notes" placeholder="${tt.notesPlaceholder}">${escapeHtml(state.notes[current]||'')}</textarea></section><section class="pane" data-pane="cards"><h2>${tt.cardsTitle}</h2><div class="flashcard" id="flashcard"></div><div class="flash-actions"><button class="btn" id="flip">${tt.flip}</button><button class="btn primary" id="nextCard">${tt.nextCard}</button></div></section><section class="pane" data-pane="quiz"><h2>${state.lang==='es'?`Examen de la Lección ${current}`:`Lesson ${current} Quiz`}</h2>${is2?`<p class="small">${state.lang==='es'?'El objetivo es demostrar comprensión, no solo memoria. Se requiere 80% para aprobar.':'The goal is to demonstrate understanding, not just memory. 80% is required to pass.'}</p>`:''}<form id="quizForm">${qs.map((q,i)=>`<div class="quiz-q"><b>${i+1}. ${q[0]}</b>${q[1].map((a,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${a}</label>`).join('')}</div>`).join('')}<button class="btn primary" type="submit">${tt.grade}</button><div class="score" id="score"></div><div class="quiz-feedback" id="quizFeedback"></div></form></section>`);content.dataset.cardset=is2?'2':'1'}
 bindContent();
}
function bindContent(){document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{document.querySelectorAll('.tab,.pane').forEach(y=>y.classList.remove('active'));x.classList.add('active');document.querySelector(`[data-pane="${x.dataset.tab}"]`).classList.add('active')});const n=document.querySelector('#notes');if(n)n.oninput=()=>{state.notes[current]=n.value;saveLocal();cloudNote(current,n.value)};
 const r=document.querySelector('#lessonReflection');if(r){r.value=state.notes[current]||'';r.oninput=()=>{state.notes[current]=r.value;saveLocal();cloudNote(current,r.value)}}
 document.querySelectorAll('.gate-check').forEach(btn=>btn.onclick=()=>{const box=btn.closest('.check-gate'),picked=box.querySelector('input:checked'),fb=box.querySelector('.gate-feedback');if(!picked){fb.textContent=state.lang==='es'?'Selecciona una respuesta antes de comprobar.':'Select an answer before checking.';fb.classList.add('show');return}const ok=+picked.value===+btn.dataset.answer;fb.textContent=ok?(state.lang==='es'?'Correcto. Explica la idea con tus propias palabras antes de continuar.':'Correct. Explain the idea in your own words before continuing.'):(state.lang==='es'?'Aún no. Relee la explicación inmediatamente anterior y fíjate en la diferencia conceptual, no solo en las palabras.':'Not yet. Reread the explanation immediately above and focus on the conceptual difference, not only the wording.');fb.classList.add('show')});
 let ci=0,flipped=false;const fc=document.querySelector('#flashcard');if(fc){const c=current===2?cards2[state.lang]:cards[state.lang],show=()=>fc.textContent=c[ci][flipped?1:0];show();flip.onclick=()=>{flipped=!flipped;show()};nextCard.onclick=()=>{ci=(ci+1)%c.length;flipped=false;show()}}
 const qf=document.querySelector('#quizForm');if(qf)qf.onsubmit=e=>{e.preventDefault();const qs=current===2?questions2[state.lang]:questions[state.lang];let s=0,ans={};qs.forEach((q,i)=>{const a=qf.querySelector(`[name=q${i}]:checked`);if(a){ans[i]=+a.value;if(+a.value===q[2])s++}});state.quiz[current]=s;saveLocal();const pass=s>=Math.ceil(qs.length*.8);score.textContent=`${state.lang==='es'?'Resultado':'Result'}: ${s} / ${qs.length} — ${pass?t().solid:t().review}`;const review=document.querySelector('#quizFeedback');if(review&&current===2){review.innerHTML=qs.map((q,i)=>{const chosen=ans[i],ok=chosen===q[2];return `<div class="quiz-review ${ok?'correct':''}"><b>${ok?(state.lang==='es'?'✓ Correcta':'✓ Correct'):(state.lang==='es'?'Revisar pregunta ':'Review question ')+(i+1)}</b>${ok?(state.lang==='es'?'Comprendiste este concepto.':'You understood this concept.'):(chosen===undefined?(state.lang==='es'?'No seleccionaste una respuesta. ':'You did not select an answer. '):'')+q[3]}</div>`}).join('')};saveQuiz(current,s,ans,qs.length);if(current===2&&pass&&(state.status[2]||'not_started')==='not_started'){state.status[2]='understood';statusSelect.value='understood';saveLocal();renderNav(search.value);cloudStatus(2,'understood')}}}
function renderProgress(){const vals=Object.values(state.status),done=vals.filter(x=>x==='mastered').length,active=vals.filter(x=>x&&x!=='not_started'&&x!=='mastered').length;progressText.textContent=t().dominated(done);studyCount.textContent=t().studying(active);progressBar.style.width=`${done/40*100}%`}
function openLesson(n){current=n;saveLocal();renderNav(search.value);renderContent();sidebar.classList.remove('open');scrollTo({top:0,behavior:'smooth'})}
function renderAll(){renderProgress();renderNav(search.value);renderContent();renderTree()}
function applyTheme(){document.documentElement.dataset.theme=state.theme||'light'}
function applyLanguage(){document.documentElement.lang=state.lang;langSelect.value=state.lang;const tt=t();subtitle.textContent=tt.subtitle;document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=tt[e.dataset.i18n]||e.dataset.i18n);search.placeholder=tt.search;chipLessons.textContent=tt.lessons;chipSync.textContent=tt.sync;chipOffline.textContent=tt.offline;footerText.textContent=tt.footer;closeMenu.textContent=tt.close;openMenu.textContent='☰ '+(state.lang==='es'?'Lecciones':'Lessons');nextBtn.textContent=tt.next;
 statusSelect.innerHTML=Object.entries(tt.statuses).map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
 authTitle.textContent=tt.authTitle;authIntro.textContent=tt.authIntro;emailLabel.textContent=tt.email;passwordLabel.textContent=tt.password;signInBtn.textContent=tt.signIn;signUpBtn.textContent=tt.signUp;
 backupTitle.textContent=tt.backupTitle;backupDesc.textContent=tt.backupDesc;exportBtn.textContent=tt.export;importLabel.childNodes[0].nodeValue=tt.import+' ';timerTitle.textContent=tt.timerTitle;startTimer.textContent=tick?tt.pause:tt.start;resetTimer.textContent=tt.reset;treeTitle.textContent=tt.treeTitle;treeIntro.textContent=tt.treeIntro;treeNote.textContent=tt.treeNote;
 legend0.textContent=tt.statuses.not_started;legend1.textContent=tt.statuses.introduced;legend2.textContent=tt.statuses.understood;legend3.textContent=tt.statuses.applied;legend4.textContent=tt.statuses.mastered;
 document.querySelectorAll('[data-close]').forEach(b=>{
  if(b.classList.contains('modal-x')){
    b.textContent='×';
    b.setAttribute('aria-label',tt.close);
  }else{
    b.textContent=tt.close;
  }
});updateAccountUI();renderAll();
}
function updateAccountUI(){accountName.textContent=user?.email||'';accountAction.textContent=user?t().signOut:t().signedOut;setSync(user?t().synced:(navigator.onLine?t().local:t().offlineState))}
function renderTree(){const names={keter:['Keter','Corona / Crown'],chokhmah:['Chokhmah','Sabiduría / Wisdom'],binah:['Binah','Entendimiento / Understanding'],chesed:['Chesed','Misericordia / Lovingkindness'],gevurah:['Gevurah','Rigor / Severity'],tiferet:['Tiferet','Armonía / Harmony'],netzach:['Netzach','Permanencia / Endurance'],hod:['Hod','Esplendor / Splendor'],yesod:['Yesod','Fundamento / Foundation'],malkhut:['Malkhut','Reino / Kingdom']};
 const pos={keter:[171,0],chokhmah:[30,72],binah:[312,72],chesed:[30,184],gevurah:[312,184],tiferet:[168,210],netzach:[30,300],hod:[312,300],yesod:[171,340],malkhut:[171,420]};
 const center=k=>[pos[k][0]+44,pos[k][1]+44];
 const radius=44;
 const links=[['keter','chokhmah'],['keter','binah'],['keter','tiferet'],['chokhmah','binah'],['chokhmah','chesed'],['chokhmah','tiferet'],['binah','gevurah'],['binah','tiferet'],['chesed','gevurah'],['chesed','tiferet'],['chesed','netzach'],['gevurah','tiferet'],['gevurah','hod'],['tiferet','netzach'],['tiferet','hod'],['tiferet','yesod'],['netzach','hod'],['netzach','yesod'],['hod','yesod'],['yesod','malkhut']];
 const edgePoints=(a,b)=>{const [ax,ay]=center(a),[bx,by]=center(b),dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len;return [ax+ux*radius,ay+uy*radius,bx-ux*radius,by-uy*radius]};
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 430 515');svg.setAttribute('aria-hidden','true');
 links.forEach(([a,b])=>{const [x1,y1,x2,y2]=edgePoints(a,b);const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',`M ${x1} ${y1} L ${x2} ${y2}`);svg.appendChild(p)});
 tree.innerHTML='';tree.appendChild(svg);
 Object.entries(pos).forEach(([k,[x,y]])=>{const info=state.tree[k]||{},level=info.level||'not_started',u=info.unlocked||level!=='not_started';const el=document.createElement('div');el.className=`sef ${level}`;el.dataset.sefirah=k;el.style.left=x+'px';el.style.top=y+'px';el.title=`${names[k][0]} — ${u?t().statuses[level]:t().locked}`;el.innerHTML=`<div><b>${names[k][0]}</b><small>${u?t().statuses[level]:t().locked}</small></div>`;tree.appendChild(el)})
}
statusSelect.onchange=()=>{state.status[current]=statusSelect.value;saveLocal();renderNav(search.value);cloudStatus(current,statusSelect.value)};
nextBtn.onclick=()=>openLesson(Math.min(40,current+1));search.oninput=()=>renderNav(search.value);openMenu.onclick=()=>sidebar.classList.add('open');closeMenu.onclick=()=>sidebar.classList.remove('open');
themeBtn.onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';applyTheme();saveLocal()};
langSelect.onchange=()=>{state.lang=langSelect.value;saveLocal();applyLanguage();saveLang()};
backupBtn.onclick=()=>backupModal.classList.add('open');timerBtn.onclick=()=>timerModal.classList.add('open');treeBtn.onclick=()=>{renderTree();treeModal.classList.add('open')};
document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove('open')});
document.addEventListener('click',e=>{const b=e.target.closest('[data-close]');if(!b)return;const m=b.closest('.modal');if(m)m.classList.remove('open')});
exportBtn.onclick=()=>{const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kabbalah-backup.json';a.click();URL.revokeObjectURL(a.href)};
importFile.onchange=async()=>{try{const d=JSON.parse(await importFile.files[0].text());state={...state,...d};current=state.current||1;saveLocal();applyTheme();applyLanguage();backupModal.classList.remove('open')}catch{alert(state.lang==='es'?'El archivo no es válido.':'The file is not valid.')}};

accountBtn.onclick=async()=>{if(user){await sb.auth.signOut();user=null;switchLocalState(null);updateAccountUI()}else authModal.classList.add('open')};
signInBtn.onclick=async()=>{authMsg.textContent='';const {data,error}=await sb.auth.signInWithPassword({email:authEmail.value.trim(),password:authPassword.value});if(error){authMsg.textContent=error.message;return}user=data.user;switchLocalState(user.id);authModal.classList.remove('open');updateAccountUI();await loadCloud()};

let seconds=1500,tick=null;function showClock(){const m=Math.floor(seconds/60),s=seconds%60;clock.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;timerBtn.textContent=`◷ ${clock.textContent}`}
startTimer.onclick=()=>{if(tick){clearInterval(tick);tick=null;startTimer.textContent=t().resume}else{tick=setInterval(()=>{if(seconds>0){seconds--;showClock()}else{clearInterval(tick);tick=null;startTimer.textContent=t().start;alert(t().sessionDone)}},1000);startTimer.textContent=t().pause}};
resetTimer.onclick=()=>{clearInterval(tick);tick=null;seconds=1500;startTimer.textContent=t().start;showClock()};

window.addEventListener('online',()=>{setSync(user?t().synced:t().local);if(user)loadCloud()});window.addEventListener('offline',()=>setSync(t().offlineState));
sb.auth.onAuthStateChange((event,session)=>{const nextUser=session?.user||null;if(nextUser){if(!user||user.id!==nextUser.id)switchLocalState(nextUser.id);user=nextUser;updateAccountUI();if(event==='SIGNED_IN')loadCloud()}else{user=null;switchLocalState(null);updateAccountUI()}});

(async function init(){
 applyTheme();applyLanguage();showClock();
 const {data:{session}}=await sb.auth.getSession();user=session?.user||null;if(user)switchLocalState(user.id);else switchLocalState(null);updateAccountUI();if(user)await loadCloud();
 if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
 setTimeout(()=>{splash.style.opacity='0';setTimeout(()=>splash.remove(),650)},2500);
})();
