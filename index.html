const lesson1={
es:`<div class="eyebrow">Lección completa</div><h2>Qué es realmente la Cábala y qué representa el Árbol de la Vida</h2><p>Comenzamos con la <b>Cábala judía histórica</b>. Más adelante compararemos la Cabala cristiana y la Qabalah hermética. Separarlas evita atribuir a la tradición judía ideas procedentes de desarrollos posteriores.</p><h3>1. Una “tradición recibida”</h3><p><b>קַבָּלָה — Kabbalah</b> procede de una raíz hebrea asociada con “recibir”. Es una tradición que explora la relación entre Dios, la creación y el ser humano: cómo lo infinito se relaciona con lo finito y cómo la multiplicidad puede surgir sin destruir la Unidad.</p><div class="callout"><b>Regla inicial:</b> no todo misticismo judío es Cábala, aunque la Cábala forme parte del misticismo judío.</div><h3>2. Tres tradiciones distintas</h3><p><b>Kabbalah o Cábala judía:</b> Torá, Ein Sof, sefirot y Zohar.<br><b>Cabala cristiana:</b> reinterpretación renacentista cristiana.<br><b>Qabalah hermética:</b> integración occidental con tarot, astrología, alquimia y magia ceremonial.</p><h3>3. Tres textos en el mapa</h3><p><b>Sefer Yetzirah</b>, texto antiguo y breve, presenta diez sefirot y veintidós letras, aunque sus sefirot no equivalen exactamente al sistema posterior. <b>Sefer ha-Bahir</b>, difundido en la Europa medieval, desarrolla el simbolismo dinámico de las sefirot. El <b>Zohar</b>, aparecido históricamente en la España del siglo XIII y atribuido por la tradición a Rabí Shimon bar Yochai, es central para la Cábala clásica.</p><h3>4. Ein Sof</h3><p><b>אין סוף — Ein Sof</b> significa “Sin Fin”. Habla de la Divinidad como infinita e incognoscible; no es el nombre de otro dios.</p><div class="callout">Si lo infinito es verdaderamente infinito, ¿cómo puede relacionarse con algo finito?</div><h3>5. Las sefirot</h3><p>Las <b>sefirot</b> pueden entenderse, según el contexto, como emanaciones, atributos, modalidades, potencias o canales de expresión divina. No son diez dioses independientes.</p><div class="flow"><b>Ein Sof</b><span>→</span><b>Diez sefirot</b><span>→</span><b>Creación</b></div><p>Como analogía inicial, imagina luz blanca atravesando un prisma: la luz sigue siendo una, aunque podamos percibir diferentes colores.</p><h3>6. Las diez sefirot</h3><p>Keter, Chokhmah, Binah, Chesed, Gevurah, Tiferet, Netzach, Hod, Yesod y Malkhut.</p><h3>7. El Árbol de la Vida</h3><p>El Árbol es una <b>representación simbólica de relaciones</b>. El dibujo no es la Cábala, del mismo modo que un plano no es la instalación que representa.</p><h3>8. Da’at</h3><p><b>דעת — Da’at</b> significa conocimiento. Aparece en ciertos diagramas, pero no debe añadirse ingenuamente como una undécima sefirá: la tradición insiste en diez.</p><h3>9. Qué no mezclar todavía</h3><p>Tarot, astrología, magia, chakras, planetas y correspondencias ocultistas se estudiarán solo después de adquirir una base que permita distinguir su origen histórico.</p><div class="callout"><b>Modelo mental:</b> Ein Sof = lo ilimitado; sefirot = diez modalidades de manifestación; Árbol de la Vida = mapa simbólico de sus relaciones.</div>`,
en:`<div class="eyebrow">Complete lesson</div><h2>What Kabbalah really is and what the Tree of Life represents</h2><p>We begin with <b>historical Jewish Kabbalah</b>. Later we will compare Christian Cabala and Hermetic Qabalah. Keeping them distinct prevents later developments from being projected backward onto Jewish tradition.</p><h3>1. A “received tradition”</h3><p><b>קַבָּלָה — Kabbalah</b> comes from a Hebrew root associated with “receiving.” It explores the relationship among God, creation, and the human being: how the infinite relates to the finite and how multiplicity can arise without destroying Unity.</p><div class="callout"><b>Initial rule:</b> not all Jewish mysticism is Kabbalah, although Kabbalah belongs to Jewish mysticism.</div><h3>2. Three distinct traditions</h3><p><b>Jewish Kabbalah:</b> Torah, Ein Sof, sefirot, and Zohar.<br><b>Christian Cabala:</b> Christian Renaissance reinterpretation.<br><b>Hermetic Qabalah:</b> Western synthesis involving tarot, astrology, alchemy, and ceremonial magic.</p><h3>3. Three texts on the map</h3><p><b>Sefer Yetzirah</b>, an ancient concise text, presents ten sefirot and twenty-two letters, although its sefirot are not identical to the later system. <b>Sefer ha-Bahir</b>, circulated in medieval Europe, develops dynamic sefirotic symbolism. The <b>Zohar</b>, historically appearing in thirteenth-century Spain and traditionally attributed to Rabbi Shimon bar Yochai, is central to classical Kabbalah.</p><h3>4. Ein Sof</h3><p><b>אין סוף — Ein Sof</b> means “Without End.” It speaks of the Divine as infinite and unknowable; it is not the name of another god.</p><div class="callout">If the infinite is truly infinite, how can it relate to something finite?</div><h3>5. The sefirot</h3><p>Depending on context, the <b>sefirot</b> may be understood as emanations, attributes, modalities, powers, or channels of divine expression. They are not ten independent gods.</p><div class="flow"><b>Ein Sof</b><span>→</span><b>Ten sefirot</b><span>→</span><b>Creation</b></div><p>As an initial analogy, imagine white light passing through a prism: the light remains one even though different colors become perceptible.</p><h3>6. The ten sefirot</h3><p>Keter, Chokhmah, Binah, Chesed, Gevurah, Tiferet, Netzach, Hod, Yesod, and Malkhut.</p><h3>7. The Tree of Life</h3><p>The Tree is a <b>symbolic representation of relationships</b>. The diagram is not Kabbalah itself, just as a blueprint is not the installation it represents.</p><h3>8. Da’at</h3><p><b>דעת — Da’at</b> means knowledge. It appears in some diagrams but should not simply be added as an eleventh sefirah: the tradition insists on ten.</p><h3>9. What not to mix in yet</h3><p>Tarot, astrology, magic, chakras, planets, and occult correspondences will be studied only after a foundation is strong enough to distinguish their historical origins.</p><div class="callout"><b>Mental model:</b> Ein Sof = the unlimited; sefirot = ten modalities of manifestation; Tree of Life = symbolic map of their relationships.</div>`
};

const BASE_KEY='kabbalah-study-v4';
const freshState=()=>({current:1,status:{},notes:{},theme:'light',quiz:{},lang:'es',tree:{}});
let activeStorageKey=`${BASE_KEY}-guest`;
let state=JSON.parse(localStorage.getItem(activeStorageKey)||'null')||freshState();
let current=state.current||1, user=null, noteTimers={}, syncing=false;

function switchLocalState(uid=null){
  activeStorageKey=uid?`${BASE_KEY}-user-${uid}`:`${BASE_KEY}-guest`;
  state=JSON.parse(localStorage.getItem(activeStorageKey)||'null')||freshState();
  current=state.current||1;
  applyTheme();
  applyLanguage();
}
function t(){return I[state.lang||'es']}
function lessons(){const arr=[];stageData[state.lang||'es'].forEach(([stage,names])=>names.forEach(name=>arr.push({n:arr.length+1,name,stage})));return arr}
function saveLocal(){state.current=current;localStorage.setItem(activeStorageKey,JSON.stringify(state));renderProgress()}
function escapeHtml(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

async function loadCloud(){
 if(!user)return;
 setSync(t().syncing);
 try{
  const [{data:p},{data:n},{data:tr},{data:pr}]=await Promise.all([
   sb.from('lesson_progress').select('*').eq('user_id',user.id),
   sb.from('user_notes').select('*').eq('user_id',user.id),
   sb.from('user_tree').select('*').eq('user_id',user.id),
   sb.from('profiles').select('*').eq('id',user.id).maybeSingle()
  ]);
  if(p) p.forEach(x=>state.status[x.lesson_number]=x.status);
  if(n) n.forEach(x=>{if(x.lesson_number)state.notes[x.lesson_number]=x.note_text});
  if(tr) tr.forEach(x=>state.tree[x.sefirah_key]={level:x.mastery_level,unlocked:x.unlocked,reflection:x.reflection||''});
  if(pr?.preferred_language && ['es','en'].includes(pr.preferred_language)) state.lang=pr.preferred_language;
  saveLocal(); applyLanguage(); renderAll(); setSync(t().synced);
 }catch(e){console.error(e);setSync(navigator.onLine?t().local:t().offlineState)}
}

async function cloudStatus(lesson,status){
 if(!user)return;
 setSync(t().syncing);
 const payload={user_id:user.id,lesson_number:lesson,status,percent_complete:status==='mastered'?100:status==='not_started'?0:25,started_at:status==='not_started'?null:new Date().toISOString(),completed_at:status==='mastered'?new Date().toISOString():null,updated_at:new Date().toISOString()};
 const {error}=await sb.from('lesson_progress').upsert(payload,{onConflict:'user_id,lesson_number'});
 if(error) console.error(error);
 const map={4:'keter',5:'chokhmah',6:'binah',7:'chesed',8:'gevurah',9:'tiferet',10:'netzach',11:'hod',12:'yesod',13:'malkhut'};
 if(map[lesson]){
   const unlocked=status!=='not_started';
   await sb.from('user_tree').update({mastery_level:status,unlocked,updated_at:new Date().toISOString()}).eq('user_id',user.id).eq('sefirah_key',map[lesson]);
   state.tree[map[lesson]]={...(state.tree[map[lesson]]||{}),level:status,unlocked};
 }
 setSync(error?t().local:t().synced); renderTree();
}

async function cloudNote(lesson,text){
 if(!user)return;
 clearTimeout(noteTimers[lesson]);
 noteTimers[lesson]=setTimeout(async()=>{
  setSync(t().syncing);
  const {data:existing}=await sb.from('user_notes').select('id').eq('user_id',user.id).eq('lesson_number',lesson).limit(1);
  let error;
  if(existing?.length) ({error}=await sb.from('user_notes').update({note_text:text,updated_at:new Date().toISOString()}).eq('id',existing[0].id));
  else if(text.trim()) ({error}=await sb.from('user_notes').insert({user_id:user.id,lesson_number:lesson,note_text:text}));
  setSync(error?t().local:t().synced);
 },700);
}

async function saveQuiz(scoreVal,answers){
 if(!user)return;
 await sb.from('assessments').insert({user_id:user.id,lesson_number:1,score:scoreVal/questions[state.lang].length*100,passed:scoreVal>=4,answers});
}

async function saveLang(){
 if(user) await sb.from('profiles').update({preferred_language:state.lang,updated_at:new Date().toISOString()}).eq('id',user.id);
}

function setSync(s){syncState.textContent=s}
function renderNav(filter=''){let html='';const ls=lessons();stageData[state.lang].forEach(([stage])=>{const subset=ls.filter(l=>l.stage===stage&&(`${l.n} ${l.name}`.toLowerCase().includes(filter.toLowerCase())));if(!subset.length)return;html+=`<div class="stage">${stage}</div>`+subset.map(l=>`<button class="lesson-link ${l.n===current?'active':''}" data-lesson="${l.n}"><span class="num">${l.n}</span><span>${l.name}</span><i class="dot ${state.status[l.n]||''}"></i></button>`).join('')});lessonNav.innerHTML=html;document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>openLesson(+b.dataset.lesson))}
function tabs(inner){const x=t().tabs;return `<div class="tabs"><button class="tab active" data-tab="lesson">${x[0]}</button><button class="tab" data-tab="notes">${x[1]}</button><button class="tab" data-tab="cards">${x[2]}</button><button class="tab" data-tab="quiz">${x[3]}</button></div>${inner}`}
function renderContent(){const l=lessons()[current-1], tt=t();stageLabel.textContent=l.stage;heroTitle.textContent=`${state.lang==='es'?'Lección':'Lesson'} ${l.n} — ${l.name}`;heroDesc.textContent=current===1?tt.hero1:tt.future;statusSelect.value=state.status[current]||'not_started';
 if(current!==1){content.innerHTML=tabs(`<section class="pane active" data-pane="lesson"><div class="empty"><div class="sigil" style="margin:auto">${current}</div><h2>${l.name}</h2><p>${tt.future}</p></div></section><section class="pane" data-pane="notes"><h2>${tt.notesTitle}</h2><p class="small">${tt.notesAuto}</p><textarea class="notes" id="notes" placeholder="${tt.notesPlaceholder}">${escapeHtml(state.notes[current]||'')}</textarea></section><section class="pane" data-pane="cards"><div class="empty"><h2>${tt.cardsFuture}</h2></div></section><section class="pane" data-pane="quiz"><div class="empty"><h2>${tt.quizFuture}</h2></div></section>`)}
 else {const qs=questions[state.lang];content.innerHTML=tabs(`<section class="pane active" data-pane="lesson">${lesson1[state.lang]}</section><section class="pane" data-pane="notes"><h2>${tt.notesTitle}</h2><p class="small">${tt.notesAuto}</p><textarea class="notes" id="notes" placeholder="${tt.notesPlaceholder}">${escapeHtml(state.notes[1]||'')}</textarea></section><section class="pane" data-pane="cards"><h2>${tt.cardsTitle}</h2><div class="flashcard" id="flashcard"></div><div class="flash-actions"><button class="btn" id="flip">${tt.flip}</button><button class="btn primary" id="nextCard">${tt.nextCard}</button></div></section><section class="pane" data-pane="quiz"><h2>${tt.quizTitle}</h2><form id="quizForm">${qs.map((q,i)=>`<div class="quiz-q"><b>${i+1}. ${q[0]}</b>${q[1].map((a,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${a}</label>`).join('')}</div>`).join('')}<button class="btn primary" type="submit">${tt.grade}</button><div class="score" id="score"></div></form></section>`)}
 bindContent();
}
function bindContent(){document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{document.querySelectorAll('.tab,.pane').forEach(y=>y.classList.remove('active'));x.classList.add('active');document.querySelector(`[data-pane="${x.dataset.tab}"]`).classList.add('active')});const n=document.querySelector('#notes');if(n)n.oninput=()=>{state.notes[current]=n.value;saveLocal();cloudNote(current,n.value)};
 let ci=0,flipped=false;const fc=document.querySelector('#flashcard');if(fc){const c=cards[state.lang],show=()=>fc.textContent=c[ci][flipped?1:0];show();flip.onclick=()=>{flipped=!flipped;show()};nextCard.onclick=()=>{ci=(ci+1)%c.length;flipped=false;show()}}
 const qf=document.querySelector('#quizForm');if(qf)qf.onsubmit=e=>{e.preventDefault();let s=0,ans={};questions[state.lang].forEach((q,i)=>{const a=qf.querySelector(`[name=q${i}]:checked`);if(a){ans[i]=+a.value;if(+a.value===q[2])s++}});state.quiz[1]=s;saveLocal();score.textContent=`${state.lang==='es'?'Resultado':'Result'}: ${s} / ${questions[state.lang].length} — ${s>=4?t().solid:t().review}`;saveQuiz(s,ans)}}
function renderProgress(){const vals=Object.values(state.status),done=vals.filter(x=>x==='mastered').length,active=vals.filter(x=>x&&x!=='not_started'&&x!=='mastered').length;progressText.textContent=t().dominated(done);studyCount.textContent=t().studying(active);progressBar.style.width=`${done/40*100}%`}
function openLesson(n){current=n;saveLocal();renderNav(search.value);renderContent();sidebar.classList.remove('open');scrollTo({top:0,behavior:'smooth'})}
function renderAll(){renderProgress();renderNav(search.value);renderContent();renderTree()}
function applyTheme(){document.documentElement.dataset.theme=state.theme||'light'}
function applyLanguage(){document.documentElement.lang=state.lang;langSelect.value=state.lang;const tt=t();subtitle.textContent=tt.subtitle;document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=tt[e.dataset.i18n]||e.dataset.i18n);search.placeholder=tt.search;chipLessons.textContent=tt.lessons;chipSync.textContent=tt.sync;chipOffline.textContent=tt.offline;footerText.textContent=tt.footer;closeMenu.textContent=tt.close;openMenu.textContent='☰ '+(state.lang==='es'?'Lecciones':'Lessons');nextBtn.textContent=tt.next;
 statusSelect.innerHTML=Object.entries(tt.statuses).map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
 authTitle.textContent=tt.authTitle;authIntro.textContent=tt.authIntro;emailLabel.textContent=tt.email;passwordLabel.textContent=tt.password;signInBtn.textContent=tt.signIn;signUpBtn.textContent=tt.signUp;
 backupTitle.textContent=tt.backupTitle;backupDesc.textContent=tt.backupDesc;exportBtn.textContent=tt.export;importLabel.childNodes[0].nodeValue=tt.import+' ';timerTitle.textContent=tt.timerTitle;startTimer.textContent=tick?tt.pause:tt.start;resetTimer.textContent=tt.reset;treeTitle.textContent=tt.treeTitle;treeIntro.textContent=tt.treeIntro;treeNote.textContent=tt.treeNote;
 legend0.textContent=tt.statuses.not_started;legend1.textContent=tt.statuses.introduced;legend2.textContent=tt.statuses.understood;legend3.textContent=tt.statuses.applied;legend4.textContent=tt.statuses.mastered;
 document.querySelectorAll('[data-close]').forEach(b=>b.textContent=tt.close);updateAccountUI();renderAll();
}
function updateAccountUI(){accountName.textContent=user?.email||'';accountAction.textContent=user?t().signOut:t().signedOut;setSync(user?t().synced:(navigator.onLine?t().local:t().offlineState))}
function renderTree(){const names={keter:['Keter','Corona / Crown'],chokhmah:['Chokhmah','Sabiduría / Wisdom'],binah:['Binah','Entendimiento / Understanding'],chesed:['Chesed','Misericordia / Lovingkindness'],gevurah:['Gevurah','Rigor / Severity'],tiferet:['Tiferet','Armonía / Harmony'],netzach:['Netzach','Permanencia / Endurance'],hod:['Hod','Esplendor / Splendor'],yesod:['Yesod','Fundamento / Foundation'],malkhut:['Malkhut','Reino / Kingdom']};
 const pos={keter:[196,6],chokhmah:[50,92],binah:[342,92],chesed:[50,220],gevurah:[342,220],tiferet:[196,250],netzach:[50,365],hod:[342,365],yesod:[196,410],malkhut:[196,500]};
 const center=k=>[pos[k][0]+44,pos[k][1]+44];
 const links=[['keter','chokhmah'],['keter','binah'],['keter','tiferet'],['chokhmah','binah'],['chokhmah','chesed'],['chokhmah','tiferet'],['binah','gevurah'],['binah','tiferet'],['chesed','gevurah'],['chesed','tiferet'],['chesed','netzach'],['gevurah','tiferet'],['gevurah','hod'],['tiferet','netzach'],['tiferet','hod'],['tiferet','yesod'],['netzach','hod'],['netzach','yesod'],['hod','yesod'],['yesod','malkhut']];
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 480 590');svg.setAttribute('aria-hidden','true');
 links.forEach(([a,b])=>{const [x1,y1]=center(a),[x2,y2]=center(b);const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',`M ${x1} ${y1} L ${x2} ${y2}`);svg.appendChild(p)});
 tree.innerHTML='';tree.appendChild(svg);
 Object.entries(pos).forEach(([k,[x,y]])=>{const info=state.tree[k]||{},level=info.level||'not_started',u=info.unlocked||level!=='not_started';const el=document.createElement('div');el.className=`sef ${level}`;el.style.left=x+'px';el.style.top=y+'px';el.title=`${names[k][0]} — ${u?t().statuses[level]:t().locked}`;el.innerHTML=`<div><b>${names[k][0]}</b><small>${u?t().statuses[level]:t().locked}</small></div>`;tree.appendChild(el)})
}
statusSelect.onchange=()=>{state.status[current]=statusSelect.value;saveLocal();renderNav(search.value);cloudStatus(current,statusSelect.value)};
nextBtn.onclick=()=>openLesson(Math.min(40,current+1));search.oninput=()=>renderNav(search.value);openMenu.onclick=()=>sidebar.classList.add('open');closeMenu.onclick=()=>sidebar.classList.remove('open');
themeBtn.onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';applyTheme();saveLocal()};
langSelect.onchange=()=>{state.lang=langSelect.value;saveLocal();applyLanguage();saveLang()};
backupBtn.onclick=()=>backupModal.classList.add('open');timerBtn.onclick=()=>timerModal.classList.add('open');treeBtn.onclick=()=>{renderTree();treeModal.classList.add('open')};
document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove('open')});
exportBtn.onclick=()=>{const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kabbalah-backup.json';a.click();URL.revokeObjectURL(a.href)};
importFile.onchange=async()=>{try{const d=JSON.parse(await importFile.files[0].text());state={...state,...d};current=state.current||1;saveLocal();applyTheme();applyLanguage();backupModal.classList.remove('open')}catch{alert(state.lang==='es'?'El archivo no es válido.':'The file is not valid.')}};

accountBtn.onclick=async()=>{if(user){await sb.auth.signOut();user=null;switchLocalState(null);updateAccountUI()}else authModal.classList.add('open')};
signInBtn.onclick=async()=>{authMsg.textContent='';const {data,error}=await sb.auth.signInWithPassword({email:authEmail.value.trim(),password:authPassword.value});if(error){authMsg.textContent=error.message;return}user=data.user;switchLocalState(user.id);authModal.classList.remove('open');updateAccountUI();await loadCloud()};
signUpBtn.onclick=async()=>{authMsg.textContent='';const {error}=await sb.auth.signUp({email:authEmail.value.trim(),password:authPassword.value,options:{emailRedirectTo:location.origin+location.pathname}});authMsg.textContent=error?error.message:t().confirm};

let seconds=1500,tick=null;function showClock(){const m=Math.floor(seconds/60),s=seconds%60;clock.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;timerBtn.textContent=`◷ ${clock.textContent}`}
startTimer.onclick=()=>{if(tick){clearInterval(tick);tick=null;startTimer.textContent=t().resume}else{tick=setInterval(()=>{if(seconds>0){seconds--;showClock()}else{clearInterval(tick);tick=null;startTimer.textContent=t().start;alert(t().sessionDone)}},1000);startTimer.textContent=t().pause}};
resetTimer.onclick=()=>{clearInterval(tick);tick=null;seconds=1500;startTimer.textContent=t().start;showClock()};

window.addEventListener('online',()=>{setSync(user?t().synced:t().local);if(user)loadCloud()});window.addEventListener('offline',()=>setSync(t().offlineState));
sb.auth.onAuthStateChange((event,session)=>{const nextUser=session?.user||null;if(nextUser){if(!user||user.id!==nextUser.id)switchLocalState(nextUser.id);user=nextUser;updateAccountUI();if(event==='SIGNED_IN')loadCloud()}else{user=null;switchLocalState(null);updateAccountUI()}});

(async function init(){
 applyTheme();applyLanguage();showClock();
 const {data:{session}}=await sb.auth.getSession();user=session?.user||null;if(user)switchLocalState(user.id);else switchLocalState(null);updateAccountUI();if(user)await loadCloud();
 if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
 setTimeout(()=>{splash.style.opacity='0';setTimeout(()=>splash.remove(),650)},2500);
})();
</script>
</body></html>
